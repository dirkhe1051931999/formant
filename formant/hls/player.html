<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HLS</title>
    <link rel="stylesheet" href="player.css" />
    <link rel="stylesheet" href="player-panels.css" />
  </head>
  <body>
    <div id="player" class="player">
      <div class="stage" id="stage">
        <video id="video" playsinline></video>
        <div class="bezel" id="bezel" hidden>
          <div class="bezel__icon" id="bezelIcon"></div>
        </div>
        <div class="loader" id="loader" hidden></div>
        <p class="notice notice--error" id="status" hidden></p>
        <p class="notice notice--info" id="progress" hidden></p>
        <div class="headline" id="title"></div>
        <div class="mask" id="mask"></div>
        <div class="ctrl" id="ctrl">
          <div class="bar" id="barWrap">
            <div class="bar__track">
              <div class="bar__loaded" id="barLoaded"></div>
              <div class="bar__played" id="barPlayed">
                <i class="bar__thumb"></i>
              </div>
            </div>
            <span class="bar__tip" id="barTime" hidden>0:00</span>
          </div>
          <div class="icons">
            <div class="icons__left">
              <button type="button" id="play" class="icon-btn" aria-label="播放">
                <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
                <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z" /></svg>
              </button>
              <div class="vol" id="vol">
                <button type="button" id="mute" class="icon-btn" aria-label="静音">
                  <svg class="i-vol" viewBox="0 0 24 24"><path d="M5 9v6h4l5 5V4L9 9H5zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z" /></svg>
                  <svg class="i-mute" viewBox="0 0 24 24"><path d="M16.5 12a4.5 4.5 0 0 0-2.5-4v2.2l2.5 2.5V12zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.9 8.9 0 0 0 21 12c0-3.53-2.04-6.58-5-8.03v2.18c2.05 1.23 3.5 3.5 3.5 5.85zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.18a9 9 0 0 0 3.87-1.81L19.73 21 21 19.73 4.27 3zM12 4 9.91 6.09 12 8.18V4z" /></svg>
                </button>
                <div class="vol__bar" id="volBar">
                  <div class="vol__track" id="volTrack">
                    <div class="vol__fill" id="volFill"></div>
                  </div>
                </div>
              </div>
              <span id="time" class="time">0:00 / 0:00</span>
              <span id="live" class="live" hidden>直播</span>
            </div>
            <div class="icons__right">
              <button type="button" id="listBtn" class="icon-btn" hidden aria-label="频道">
                <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z" /></svg>
              </button>
              <button type="button" id="feedsBtn" class="icon-btn" aria-label="列表源">
                <svg viewBox="0 0 24 24"><path d="M4 6h10v2H4zm0 5h10v2H4zm0 5h10v2H4zm13-4.5 3 2.5-3 2.5v-5z" /></svg>
              </button>
              <button type="button" id="rawBtn" class="icon-btn" hidden aria-label="源码">
                <svg viewBox="0 0 24 24"><path d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z" /></svg>
              </button>
              <button type="button" id="save" class="icon-btn" aria-label="存 MP4">
                <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM11 4v8.17l-2.59-2.58L7 11l5 5 5-5-1.41-1.41L13 12.17V4h-2z" /></svg>
              </button>
              <div class="setting" id="setting">
                <button type="button" id="settingBtn" class="icon-btn" aria-label="设置">
                  <svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.1 7.1 0 0 0 .05-.94 7.1 7.1 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.2 7.2 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.8 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.03.3-.05.62-.05.94s.02.64.05.94L2.92 14.2a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.64.22l2.39-.96c.5.39 1.04.7 1.63.94l.36 2.54c.05.24.26.42.5.42h3.8c.24 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.55 1.63-.94l2.39.96c.24.1.51 0 .64-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z" /></svg>
                </button>
                <div class="setting__panel" id="settingPanel" hidden>
                  <div class="setting__label">倍速</div>
                  <div class="setting__rates" id="rateList"></div>
                  <button type="button" id="rotate" class="setting__row">旋转 0°</button>
                </div>
              </div>
              <button type="button" id="full" class="icon-btn" aria-label="全屏">
                <svg class="i-full" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm12 0h-2v3h-3v2h5v-5zM7 7h3V5H5v5h2V7zm12 0v3h2V5h-5v2h3z" /></svg>
                <svg class="i-exit" viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z" /></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
      <aside id="playlist" class="playlist" hidden>
        <div class="playlist__head">
          <span id="playlistHead">频道</span>
          <button type="button" id="playlistClose" class="icon-btn" aria-label="关闭频道">
            <svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z" /></svg>
          </button>
        </div>
        <div class="playlist__meta">
          <div class="playlist__url">
            <strong>列表</strong>
            <span id="listUrlView"></span>
            <button type="button" id="listUrlCopy" class="icon-btn playlist__copy" title="复制列表" aria-label="复制列表">
              <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" /></svg>
            </button>
          </div>
          <div class="playlist__url">
            <strong>播放</strong>
            <span id="playUrlView"></span>
            <button type="button" id="playUrlCopy" class="icon-btn playlist__copy" title="复制播放" aria-label="复制播放">
              <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" /></svg>
            </button>
          </div>
          <div class="playlist__acts">
            <button type="button" id="nextSrcBtn" hidden>切源</button>
          </div>
        </div>
        <div class="playlist__list" id="playlistList"></div>
      </aside>
      <div id="feedsPanel" class="sheet" hidden>
        <div class="sheet__head">
          <span>m3u / txt 源</span>
          <button type="button" id="feedsClose" class="icon-btn" aria-label="关闭">
            <svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z" /></svg>
          </button>
        </div>
        <form id="feedsForm" class="sheet__form">
          <input id="feedsInput" type="url" placeholder="https://example.com/tv.m3u" />
          <button type="submit">添加</button>
        </form>
        <div id="feedsList" class="sheet__list"></div>
      </div>
      <div id="rawPanel" class="sheet" hidden>
        <div class="sheet__head">
          <span>列表源码</span>
          <span>
            <button type="button" id="rawCopy" class="sheet__text">复制</button>
            <button type="button" id="rawClose" class="icon-btn" aria-label="关闭">
              <svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z" /></svg>
            </button>
          </span>
        </div>
        <pre id="rawText" class="sheet__pre"></pre>
      </div>
    </div>
    <script src="hls.min.js"></script>
    <script src="mux.min.js"></script>
    <script src="save-mp4.js"></script>
    <script type="module" src="player.js"></script>
    <script type="module" src="player-ui.js"></script>
  </body>
</html>
