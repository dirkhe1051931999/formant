<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HLS</title>
    <link rel="stylesheet" href="player.css" />
  </head>
  <body>
    <div class="shell">
      <div class="stage">
        <video id="video" playsinline></video>
      </div>
      <p id="status" hidden></p>
      <p id="progress" hidden></p>
      <div class="dock">
        <div class="dock__row">
          <button type="button" id="play" class="btn">播放</button>
          <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="进度" />
          <span id="time">0:00 / 0:00</span>
        </div>
        <div class="dock__row dock__row--tools">
          <label class="field">
            音量
            <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="音量" />
          </label>
          <label class="field">
            倍速
            <select id="rate" aria-label="倍速"></select>
          </label>
          <button type="button" id="rotate" class="btn">旋转 0°</button>
          <button type="button" id="save" class="btn btn--primary">存 MP4</button>
        </div>
      </div>
    </div>
    <script src="hls.min.js"></script>
    <script src="mux.min.js"></script>
    <script src="save-mp4.js"></script>
    <script src="player.js"></script>
  </body>
</html>
