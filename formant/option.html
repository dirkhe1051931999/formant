<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>formant · 扩展设置</title>
    <link rel="stylesheet" href="option.css" />
  </head>
  <body>
    <div class="app">
      <div class="shell">
        <aside class="shell-side">
          <div class="shell-top__brand">
            <img src="icons/icon32.png" width="30" height="30" alt="" />
            <h1>扩展设置</h1>
          </div>
          <nav class="shell-nav" aria-label="设置导航">
            <p class="shell-nav__group">常规</p>
            <button type="button" class="shell-nav__item is-active" data-panel="general">
              <svg class="shell-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
              <span>概览</span>
            </button>
            <button type="button" class="shell-nav__item" data-panel="features">
              <svg class="shell-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="6"/><circle cx="16" cy="12" r="3"/></svg>
              <span>功能</span>
            </button>

            <p class="shell-nav__group">浏览增强</p>
            <button type="button" class="shell-nav__item" data-panel="newtab">
              <svg class="shell-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
              <span>New Tab</span>
            </button>
            <button type="button" class="shell-nav__item" data-panel="ublock">
              <svg class="shell-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
              <span>广告拦截</span>
            </button>
            <button type="button" class="shell-nav__item" data-panel="autopagerize">
              <svg class="shell-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18v-6"/><polyline points="9 15 12 18 15 15"/></svg>
              <span>自动翻页</span>
            </button>
            <button type="button" class="shell-nav__item" data-panel="gestures">
              <svg class="shell-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17c4-8 6 4 10-6 2-5 5-3 6 0"/></svg>
              <span>手势</span>
            </button>
            <button type="button" class="shell-nav__item" data-panel="v2ex">
              <svg class="shell-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <span>V2EX</span>
            </button>
            <button type="button" class="shell-nav__item" data-panel="gitzip">
              <svg class="shell-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span>GitZip</span>
            </button>

            <p class="shell-nav__group">翻译与 AI</p>
            <button type="button" class="shell-nav__item" data-panel="translate">
              <svg class="shell-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l6 6"/><path d="M4 14l6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="M22 22l-5-10-5 10"/><path d="M14 18h6"/></svg>
              <span>翻译</span>
            </button>
            <button type="button" class="shell-nav__item" data-panel="lexicon">
              <svg class="shell-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              <span>词库</span>
            </button>
            <button type="button" class="shell-nav__item" data-panel="x-translate">
              <svg class="shell-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l16 16"/><path d="M20 4L4 20"/></svg>
              <span>X 推文</span>
            </button>
            <button type="button" class="shell-nav__item" data-panel="image-prompt">
              <svg class="shell-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <span>识图</span>
            </button>

            <p class="shell-nav__group">网络与扩展</p>
            <button type="button" class="shell-nav__item" data-panel="proxy">
              <svg class="shell-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/></svg>
              <span>代理</span>
            </button>
            <button type="button" class="shell-nav__item" data-panel="extensions">
              <svg class="shell-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 13h-2a2 2 0 0 1 0-4h2V6a2 2 0 0 0-2-2h-3v-1a2 2 0 0 0-4 0v1H7a2 2 0 0 0-2 2v3h1a2 2 0 0 1 0 4H5v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3z"/></svg>
              <span>扩展</span>
            </button>

            <p class="shell-nav__group">独立应用</p>
            <button type="button" class="shell-nav__item" data-open-window="tools.html">
              <svg class="shell-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
              <span>工具箱</span>
            </button>
            <button type="button" class="shell-nav__item" data-open-window="oolafoffice/index.html">
              <svg class="shell-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
              <span>oolafOffice</span>
            </button>

            <p class="shell-nav__group">数据</p>
            <button type="button" class="shell-nav__item" data-panel="sync">
              <svg class="shell-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              <span>同步</span>
            </button>
          </nav>
          <div class="shell-top__meta">
            <button type="button" id="shellClientKey" class="shell-key" hidden data-go-panel="sync"></button>
            <span id="shellVersion" class="shell-version"></span>
          </div>
        </aside>

        <div class="shell-body">
          <section class="panel is-active" data-panel="general" id="panel-general">
            <header class="panel__head">
              <div>
                <h2>概览</h2>
              </div>
            </header>
            <div class="general-grid">
              <article class="general-card">
                <h3>功能</h3>
                <button type="button" class="btn" data-go-panel="features">打开功能</button>
              </article>
              <article class="general-card">
                <h3>广告拦截</h3>
                <button type="button" class="btn" data-go-panel="ublock">打开广告拦截</button>
              </article>
              <article class="general-card">
                <h3>New Tab</h3>
                <button type="button" class="btn" data-go-panel="newtab">打开 New Tab 设置</button>
              </article>
              <article class="general-card">
                <h3>V2EX Plus</h3>
                <button type="button" class="btn" data-go-panel="v2ex">打开 V2EX</button>
              </article>
              <article class="general-card">
                <h3>GitZip</h3>
                <button type="button" class="btn" data-go-panel="gitzip">打开 GitZip</button>
              </article>
              <article class="general-card">
                <h3>AutoPagerize</h3>
                <button type="button" class="btn" data-go-panel="autopagerize">打开自动翻页</button>
              </article>
              <article class="general-card">
                <h3>鼠标手势</h3>
                <button type="button" class="btn" data-go-panel="gestures">打开手势</button>
              </article>
              <article class="general-card">
                <h3>代理</h3>
                <button type="button" class="btn" data-go-panel="proxy">打开代理</button>
              </article>
              <article class="general-card">
                <h3>扩展</h3>
                <button type="button" class="btn" data-go-panel="extensions">打开扩展管理</button>
              </article>
              <article class="general-card">
                <h3>词库</h3>
                <button type="button" class="btn" data-go-panel="lexicon">打开词库</button>
              </article>
              <article class="general-card">
                <h3>翻译</h3>
                <button type="button" class="btn" data-go-panel="translate">打开翻译</button>
              </article>
              <article class="general-card">
                <h3>X 推文</h3>
                <button type="button" class="btn" data-go-panel="x-translate">打开 X 推文</button>
              </article>
              <article class="general-card">
                <h3>识图</h3>
                <button type="button" class="btn" data-go-panel="image-prompt">配置模型</button>
              </article>
              <article class="general-card">
                <h3>工具箱</h3>
                <button type="button" class="btn" data-open-window="tools.html">打开工具箱</button>
              </article>
              <article class="general-card">
                <h3>oolafOffice</h3>
                <button type="button" class="btn" data-open-window="oolafoffice/index.html">打开 oolafOffice</button>
              </article>
              <article class="general-card">
                <h3>同步</h3>
                <button type="button" class="btn" data-go-panel="sync">打开同步</button>
              </article>
            </div>
          </section>
        </div>
      </div>

      <p id="toast" class="toast" hidden></p>
    </div>

    <dialog id="importDialog">
      <form method="dialog" id="importForm" class="dialog">
        <h3>导入 JSON</h3>
        <p class="dialog__hint">
          一个文件对应<strong>一种语言</strong>的词库包（字段 <code>lang</code> + <code>entries</code>）。
          不会覆盖内置包；多语言请分多个文件分别导入。
        </p>
        <fieldset class="import-mode">
          <legend>导入方式</legend>
          <label class="import-mode__option">
            <input type="radio" name="importMode" value="create" checked />
            <span>
              <strong>新建自定义包</strong>
              <small>始终新增一个包，不改动已有包（推荐）</small>
            </span>
          </label>
          <label class="import-mode__option">
            <input type="radio" name="importMode" value="merge" id="importModeMerge" />
            <span>
              <strong>合并到当前自定义包</strong>
              <small>同短语以导入为准；需先选中左侧自定义包</small>
            </span>
          </label>
          <label class="import-mode__option">
            <input type="radio" name="importMode" value="replace" id="importModeReplace" />
            <span>
              <strong>替换当前自定义包条目</strong>
              <small>清空当前包条目后再写入导入内容</small>
            </span>
          </label>
        </fieldset>
        <p id="importTargetHint" class="muted"></p>
        <div class="dialog__actions">
          <button type="submit" class="btn" value="pick">选择文件…</button>
          <button type="button" class="btn btn--ghost" id="importCancel">取消</button>
        </div>
      </form>
    </dialog>

    <dialog id="entryDialog">
      <form method="dialog" id="entryForm" class="dialog">
        <h3 id="entryDialogTitle">添加条目</h3>
        <label>
          短语
          <input id="entryPhrase" type="text" required />
        </label>
        <label>
          释义
          <input id="entryMeaning" type="text" />
        </label>
        <label>
          标签（逗号分隔）
          <input id="entryTags" type="text" placeholder="日常口语, 网络语" />
        </label>
        <label>
          例句（可选）
          <textarea id="entryExamples" rows="3" placeholder="每行一条"></textarea>
        </label>
        <div class="dialog__actions">
          <button type="submit" class="btn" value="save">保存</button>
          <button type="button" class="btn btn--ghost" id="entryCancel">取消</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="option.js"></script>
  </body>
</html>
