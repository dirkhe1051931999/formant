      <div id="proxySwitch" class="proxy-switch" hidden>
        <div class="proxy-switch__row">
          <span class="proxy-switch__label">代理</span>
          <div id="proxyChips" class="proxy-chips" role="toolbar" aria-label="代理切换"></div>
          <a id="proxyManageLink" class="proxy-switch__link" href="#proxy" title="管理代理配置">管理</a>
        </div>
        <p id="proxySwitchNote" class="proxy-switch__note" hidden></p>
      </div>

      <div id="officeSwitch" class="proxy-switch" hidden>
        <div class="proxy-switch__row">
          <span class="proxy-switch__label">oolafOffice</span>
          <div class="proxy-chips" role="toolbar" aria-label="oolafOffice">
            <button type="button" class="proxy-chip" data-office="start">起始页</button>
            <button type="button" class="proxy-chip" data-office="word">Word</button>
            <button type="button" class="proxy-chip" data-office="excel">Excel</button>
            <button type="button" class="proxy-chip" data-office="ppt">PPT</button>
          </div>
        </div>
      </div>

      <p id="translateOffBanner" class="tr-off-banner" hidden>
        弹窗翻译已关闭。可在扩展设置 → 功能 中开启；书签仍可从右上角进入。
      </p>

      <div class="tr-input-wrap">
        <textarea id="translateInput" class="tr-input" rows="3" placeholder="输入要翻译的文本…" spellcheck="false" autofocus></textarea>
        <button id="speakInputBtn" class="tr-speak" type="button" title="发音" aria-label="发音" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M4.5 9.5v5h3.2L12 18.8V5.2L7.7 9.5H4.5Z"
              fill="currentColor"
            />
            <path
              d="M15.2 8.8a4.2 4.2 0 0 1 0 6.4M17.6 6.2a7.2 7.2 0 0 1 0 11.6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <button id="clearInputBtn" class="tr-clear" type="button" title="清空" aria-label="清空" hidden>×</button>
      </div>

      <div class="tr-mode" id="translateMode" role="tablist" aria-label="翻译引擎">
        <button type="button" class="tr-mode__btn is-active" role="tab" data-mode="auto" aria-selected="true">自动</button>
        <button type="button" class="tr-mode__btn" role="tab" data-mode="google" aria-selected="false">Google</button>
        <button type="button" class="tr-mode__btn" role="tab" data-mode="gpt" aria-selected="false">GPT</button>
        <button type="button" class="tr-mode__btn" role="tab" data-mode="all" aria-selected="false">全部</button>
      </div>
      <p id="routeHint" class="tr-route-hint" hidden></p>

      <div class="tr-cards">
        <article class="tr-card" data-provider="google">
          <header class="tr-card__head">
            <div class="tr-card__brand">
              <span class="tr-logo tr-logo--g">G</span>
              <span>谷歌翻译</span>
            </div>
            <select id="googleTarget" class="tr-select" aria-label="目标语言">
              <option value="auto">自动</option>
              <option value="zh-CN">中文(简体)</option>
              <option value="en">English</option>
            </select>
          </header>
          <div id="googleResult" class="tr-card__body">
            <p class="tr-placeholder">翻译结果将显示在这里</p>
          </div>
        </article>

        <article class="tr-card" data-provider="gpt">
          <header class="tr-card__head">
            <div class="tr-card__brand">
              <span class="tr-logo tr-logo--gpt">✦</span>
              <span>ChatGPT</span>
            </div>
            <select id="gptTarget" class="tr-select" aria-label="GPT 目标语言">
              <option value="auto">自动</option>
              <option value="zh-CN">中文(简体)</option>
              <option value="en">English</option>
            </select>
          </header>
          <div id="gptResult" class="tr-card__body">
            <p class="tr-placeholder">翻译结果将显示在这里</p>
          </div>
        </article>

        <article class="tr-card" data-provider="deeplx">
          <header class="tr-card__head">
            <div class="tr-card__brand">
              <span class="tr-logo tr-logo--deeplx">D</span>
              <span>DeepLX</span>
            </div>
            <span class="tr-card__badge" id="deeplxBadge" hidden>备用</span>
          </header>
          <div id="deeplxResult" class="tr-card__body">
            <p class="tr-placeholder">Google 不可用时自动启用</p>
          </div>
        </article>
      </div>

      <footer class="tr-footer">
        <a id="linkGoogle" href="#" target="_blank" rel="noreferrer">谷歌搜索</a>
        <a id="linkWiki" href="#" target="_blank" rel="noreferrer">维基百科</a>
        <a id="linkCambridge" href="#" target="_blank" rel="noreferrer">剑桥词典</a>
      </footer>

    <section id="viewSiteData" class="view view--site-data" hidden>

        <button id="backSiteDataBtn" class="sub-head__back" type="button" aria-label="返回翻译">
          <svg viewBox="0 0 477.175 477.175" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M145.188 238.575l215.5-215.5c5.3-5.3 5.3-13.8 0-19.1s-13.8-5.3-19.1 0l-225.1 225.1c-5.3 5.3-5.3 13.8 0 19.1l225.1 225c2.6 2.6 6.1 4 9.5 4s6.9-1.3 9.5-4c5.3-5.3 5.3-13.8 0-19.1L145.188 238.575z" />

        <p id="siteDataOrigin" class="sub-head__meta" title="">…</p>
      </header>
      <p id="siteDataNote" class="sd-note" hidden></p>
      <div id="siteDataTabs" class="sd-tabs" role="tablist" aria-label="站点数据类型">
        <button type="button" class="sd-tabs__btn is-active" data-site-tab="cookie" role="tab" aria-selected="true">Cookie</button>
        <button type="button" class="sd-tabs__btn" data-site-tab="local" role="tab" aria-selected="false">Local</button>
        <button type="button" class="sd-tabs__btn" data-site-tab="session" role="tab" aria-selected="false">Session</button>
      </div>
      <div class="sd-toolbar">
        <button type="button" id="siteDataFetch" class="btn btn--ghost">刷新</button>
        <button type="button" id="siteDataCopyAll" class="btn btn--ghost">复制</button>
        <button type="button" id="siteDataClearAll" class="btn btn--ghost btn--danger">清除</button>
        <div class="sd-view-toggle" role="group" aria-label="视图">
          <button type="button" class="sd-seg is-active" data-site-view="list" aria-pressed="true">列表</button>
          <button type="button" class="sd-seg" data-site-view="raw" aria-pressed="false">原文</button>
        </div>
      </div>
      <div id="siteDataList" class="sd-list"></div>
      <textarea id="siteDataRaw" class="sd-raw" hidden placeholder="进入后自动读取…" spellcheck="false"></textarea>
    </section>

        <p id="extensionsPopupState" class="sub-head__meta" title="">…</p>

      <p id="extensionsPopupNote" class="sd-note" hidden></p>
      <div class="sd-toolbar">
        <input id="extensionsPopupSearch" class="ext-pop-search" type="search" placeholder="搜索名称 / ID" autocomplete="off" />
      </div>
      <div id="extensionsPopupList" class="ext-pop-list"></div>
    </section>
